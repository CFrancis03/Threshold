name: Deploy to GitHub Pages

on:
  push:
    # This repository's only branch is currently the default one. Trim this
    # list down to whichever branch you settle on.
    branches: [main, claude/neuron-lab-visualizer-mvp2dq]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # deploy-pages uses this to prove the artifact came from this workflow run.
  id-token: write

# One deploy at a time. Queued runs wait rather than cancel, so a push that
# lands mid-deploy still ships rather than being dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The maths is the whole site. If the tests are red, do not publish it.
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
